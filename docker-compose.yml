services:
  autocatalog-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GENERATE_SOURCEMAP=${GENERATE_SOURCEMAP:?Please set GENERATE_SOURCEMAP}
        - VITE_API_URL=${VITE_API_URL:?Please set VITE_API_URL}
        - VITE_API_TOKEN=${VITE_API_TOKEN:?Please set VITE_API_TOKEN}
        - VITE_API_IMG_BASE=${VITE_API_IMG_BASE:?Please set VITE_API_IMG_BASE}
    container_name: autocatalog-front
    ports:
      - 8085:8085
    restart: unless-stopped
