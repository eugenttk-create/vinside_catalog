# Load dynamic modules
load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;

pcre_jit on;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Allow ngx_http_lua (LuaJIT/Lua 5.1) to find LuaRocks-installed modules
    lua_package_path "/usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua;;";
    lua_package_cpath "/usr/local/lib/lua/5.1/?.so;/usr/lib/lua/5.1/?.so;;";

    log_format  main  '$remote_addr ($http_origin) - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # Define a map to check the incoming Origin header
    map $http_origin $cors_origin {
        default "*";
        
        # List of allowed origins
        https://pro.carcatonline.com "https://pro.carcatonline.com";
        https://motorhub.com.ua "https://motorhub.com.ua";
    }

    server {
        listen 8085;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

        # Cache static assets
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Accept, Content-Type' always;

            # Handle CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*' always;
                add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Origin, Accept, Content-Type' always;
                add_header Access-Control-Allow-Private-Network 'true' always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }
        }

        # Handle SPA routing - redirect all requests to index.html
        location / {
            # Handle CORS preflight for API-like requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*' always;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Origin, Accept, Content-Type, Authorization, Accept-Language, carcat-session' always;
                add_header Access-Control-Allow-Private-Network 'true' always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }

            try_files $uri $uri/ /index.html;
            access_by_lua_block {
                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(1000) -- 1 second

                local ok, err = red:connect("192.168.30.82", 6379)
                if not ok then
                    ngx.log(ngx.ERR, "failed to connect to redis: ", err)
                    return
                end
                local ok, err = red:select(5)
                if not ok then
                    ngx.log(ngx.ERR, "failed to switch DB: ", err)
                    return
                end
                -- Store the IP in a Redis set or increment a counter
                local client_ip = ngx.var.remote_addr
                -- Save IP as a key: ip:<client_ip> with value <client_ip>, expiring in 12 hours
                local key = "ip:" .. client_ip
                local ok, err = red:set(key, client_ip)
                if not ok then
                    ngx.log(ngx.ERR, "failed to set key in redis: ", err)
                else
                    local ok2, err2 = red:expire(key, 12 * 60 * 60)
                    if not ok2 then
                        ngx.log(ngx.ERR, "failed to set expiry in redis: ", err2)
                    end
                end
                -- Optional: Keep-alive for performance
                red:set_keepalive(10000, 10)
            }
            # Security headers
            #add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Accept, Content-Type, Authorization, Accept-Language, carcat-session' always;
            add_header Access-Control-Allow-Private-Network 'true' always;
            #add_header Access-Control-Allow-Origin $cors_origin always;
            #add_header Access-Control-Allow-Origin 'https://motorhub.com.ua' always;
            #add_header Access-Control-Allow-Credentials 'true' always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        set_real_ip_from 192.168.30.40;
        real_ip_header X-Real-IP;
    }
}
